<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Pig / Szabi -->
  <ellipse cx="60" cy="55" rx="32" ry="24" fill="#f49ac2" stroke="#a8436e" stroke-width="3"/>
  <!-- Highlights -->
  <path d="M 40 42 Q 50 38 60 42" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Tail -->
  <path d="M 28 55 Q 20 48 24 40 Q 28 35 22 42" stroke="#a8436e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <polygon points="52,32 62,15 68,30" fill="#f49ac2" stroke="#a8436e" stroke-width="2.5"/>
  <!-- Snout -->
  <ellipse cx="88" cy="58" rx="14" ry="11" fill="#f8b4d0" stroke="#a8436e" stroke-width="2.5"/>
  <ellipse cx="84" cy="57" rx="2" ry="3.5" fill="#a8436e"/>
  <ellipse cx="92" cy="57" rx="2" ry="3.5" fill="#a8436e"/>
  <!-- Eye -->
  <circle cx="78" cy="46" r="6" fill="#fff" stroke="#a8436e" stroke-width="2"/>
  <circle cx="80" cy="46" r="2.5" fill="#222"/>
  <!-- Legs -->
  <rect x="42" y="72" width="9" height="18" rx="4" fill="#e07ba6" stroke="#a8436e" stroke-width="2.5"/>
  <rect x="65" y="72" width="9" height="18" rx="4" fill="#e07ba6" stroke="#a8436e" stroke-width="2.5"/>
  <path d="M 42 84 c 0 6 9 6 9 0 Z" fill="#7a2d4b"/>
  <path d="M 65 84 c 0 6 9 6 9 0 Z" fill="#7a2d4b"/>
</svg>