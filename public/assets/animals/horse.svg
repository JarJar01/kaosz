<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <!-- Horse / Dani -->
  <!-- Body -->
  <ellipse cx="56" cy="65" rx="28" ry="20" fill="#a0522d" stroke="#5c2c16" stroke-width="3"/>
  <path d="M 40 54 Q 56 48 70 54" stroke="#c87546" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Tail -->
  <path d="M 30 62 Q 18 56 22 74 Q 26 80 32 72" fill="#3d1c0a" stroke="#5c2c16" stroke-width="2"/>
  <!-- Neck & Head -->
  <path d="M 72 58 L 90 35 L 104 42 L 84 72 Z" fill="#a0522d" stroke="#5c2c16" stroke-width="3" stroke-linejoin="round"/>
  <!-- Snout -->
  <ellipse cx="102" cy="44" rx="10" ry="7" fill="#c87546" stroke="#5c2c16" stroke-width="2.5"/>
  <circle cx="106" cy="43" r="1.5" fill="#5c2c16"/>
  <!-- Ears -->
  <polygon points="82,36 80,18 90,28" fill="#a0522d" stroke="#5c2c16" stroke-width="2.5"/>
  <!-- Mane -->
  <path d="M 76 36 Q 72 48 76 58" stroke="#3d1c0a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="92" cy="38" r="4.5" fill="#fff" stroke="#5c2c16" stroke-width="1.8"/>
  <circle cx="93" cy="38" r="2" fill="#222"/>
  <!-- Legs -->
  <rect x="40" y="80" width="7" height="22" rx="3" fill="#8b4513" stroke="#5c2c16" stroke-width="2.5"/>
  <rect x="65" y="80" width="7" height="22" rx="3" fill="#8b4513" stroke="#5c2c16" stroke-width="2.5"/>
  <path d="M 40 96 h 7 v 6 h -7 z" fill="#2b1409"/>
  <path d="M 65 96 h 7 v 6 h -7 z" fill="#2b1409"/>
</svg>