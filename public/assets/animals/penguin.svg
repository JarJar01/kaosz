<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Penguin / Levi -->
  <ellipse cx="50" cy="58" rx="28" ry="34" fill="#243b55" stroke="#101d2e" stroke-width="3"/>
  <!-- Belly -->
  <ellipse cx="50" cy="62" rx="20" ry="26" fill="#f0f4f8"/>
  <!-- Head tufts / Ears -->
  <polygon points="36,28 30,14 44,24" fill="#243b55" stroke="#101d2e" stroke-width="2"/>
  <polygon points="64,28 70,14 56,24" fill="#243b55" stroke="#101d2e" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="42" cy="45" r="5.5" fill="#fff" stroke="#101d2e" stroke-width="2"/>
  <circle cx="43" cy="45" r="2.2" fill="#222"/>
  <circle cx="58" cy="45" r="5.5" fill="#fff" stroke="#101d2e" stroke-width="2"/>
  <circle cx="57" cy="45" r="2.2" fill="#222"/>
  <!-- Beak -->
  <polygon points="50,49 59,55 50,61" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
  <!-- Flippers -->
  <ellipse cx="26" cy="60" rx="7" ry="14" fill="#243b55" stroke="#101d2e" stroke-width="2" transform="rotate(15 26 60)"/>
  <ellipse cx="74" cy="60" rx="7" ry="14" fill="#243b55" stroke="#101d2e" stroke-width="2" transform="rotate(-15 74 60)"/>
  <!-- Feet -->
  <ellipse cx="40" cy="94" rx="8" ry="4" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
  <ellipse cx="60" cy="94" rx="8" ry="4" fill="#f6ad55" stroke="#c05621" stroke-width="2"/>
</svg>