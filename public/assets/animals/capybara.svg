<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Capybara / Bence -->
  <ellipse cx="60" cy="55" rx="35" ry="23" fill="#b0733e" stroke="#663c18" stroke-width="3"/>
  <!-- Body contour -->
  <path d="M 40 40 Q 55 35 70 40" stroke="#d49b6a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <!-- Tail -->
  <path d="M 26 56 Q 20 50 24 45" stroke="#663c18" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <circle cx="52" cy="34" r="5" fill="#b0733e" stroke="#663c18" stroke-width="2.5"/>
  <!-- Snout / Head front -->
  <ellipse cx="90" cy="56" rx="14" ry="12" fill="#d9ad82" stroke="#663c18" stroke-width="2.5"/>
  <!-- Eye -->
  <circle cx="78" cy="45" r="5.5" fill="#fff" stroke="#663c18" stroke-width="2"/>
  <circle cx="80" cy="45" r="2.5" fill="#222"/>
  <!-- Nose dot -->
  <circle cx="101" cy="56" r="2" fill="#663c18"/>
  <!-- Legs -->
  <rect x="44" y="70" width="8" height="20" rx="3" fill="#9c6334" stroke="#663c18" stroke-width="2.5"/>
  <rect x="68" y="70" width="8" height="20" rx="3" fill="#9c6334" stroke="#663c18" stroke-width="2.5"/>
  <path d="M 44 86 c 0 4 8 4 8 0 Z" fill="#523013"/>
  <path d="M 68 86 c 0 4 8 4 8 0 Z" fill="#523013"/>
</svg>